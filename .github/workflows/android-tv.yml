name: Android TV
# Rebuild Myo after the Android TV app-name change.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app-tv/**"
      - ".github/workflows/android-tv.yml"
  push:
    branches:
      - main
      - feature/android-tv-premium
    paths:
      - "app-tv/**"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package was removed from Google's SDK repository.
          packages: 'platform-tools'

      - name: Install Android platform and native toolchains
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          # Android SDK publishes API 37 under android-37.0 while compileSdk=37
          # asks Gradle for android-37. Keep both names available to AGP.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Run unit tests and build debug APKs
        working-directory: app-tv
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myo-tv-arm64-apk
          path: app-tv/app/build/outputs/apk/debug/*arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
