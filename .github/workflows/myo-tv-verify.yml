name: MYO Android TV — branch verification

on:
  push:
    branches:
      - myo/onyx-provider-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tv:
    name: Compile and test native TV app
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout MYO
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app-tv/**/*.gradle*
      # GitHub-hosted Ubuntu runners already provide Android command-line tools.
      # setup-android@v3 calls the removed SDK package "tools" and fails on current runners.
      - name: Install Android TV build prerequisites
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Android 17 / API 37 is a preview and may only be published on a preview channel.
          "$SDKMANAGER" --list --channel=3 | grep -E 'platforms;android-|build-tools;37|cmake;3.22' | sed -n '1,35p' || true
          "$SDKMANAGER" --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Unit tests and unsigned debug APKs
        working-directory: app-tv
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Probe public licensed-video metadata (network diagnostic, not a playback test)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY' | tee open-cinema-network.txt
          import json
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          works = ["BigBuckBunny_124", "Sintel", "Tears-of-Steel", "ElephantsDream"]
          for item in works:
              try:
                  req = Request("https://archive.org/metadata/" + quote(item), headers={"User-Agent":"MYO-TV-QA/0.1"})
                  with urlopen(req, timeout=15) as response:
                      root = json.loads(response.read(2_000_000))
                  files = root.get("files") or []
                  movies = []
                  for file in files:
                      name = str(file.get("name", ""))
                      try: size = int(file.get("size", "0"))
                      except (TypeError, ValueError): size = 0
                      if name.lower().endswith(".mp4") and 15_000_000 < size < 2_000_000_000 and not any(word in name.lower() for word in ["trailer", "preview", "thumb", "sample", "clip", "segment"]):
                          movies.append((size,name))
                  movies.sort()
                  if not movies:
                      print(item, "NO_VERIFIED_MP4", flush=True)
                      continue
                  name = movies[0][1]
                  url = "https://archive.org/download/" + quote(item) + "/" + quote(name)
                  req = Request(url, headers={"Range":"bytes=0-1023","User-Agent":"MYO-TV-QA/0.1"})
                  with urlopen(req, timeout=20) as response:
                      code = response.status
                      sample = response.read(1024)
                  print(item, "file_from_metadata=", name, "http=",code,"bytes_read=",len(sample),flush=True)
              except Exception as exc:
                  print(item, "NOT_VERIFIED:", type(exc).__name__, str(exc)[:180],flush=True)
          PY
      - name: Archive public-source network diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myo-open-cinema-network
          path: open-cinema-network.txt
          if-no-files-found: ignore
      - name: Archive source test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myo-tv-test-reports
          path: |
            app-tv/app/build/test-results/testDebugUnitTest/**
            app-tv/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
      - name: Archive debug APKs (unverified on Sony Bravia)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myo-tv-debug-apks
          path: app-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
